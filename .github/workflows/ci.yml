name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Tests (offline)
        run: python -m pytest -v
      - name: Example digest (lock check, fill, self-check, send to stdout)
        run: python -m locked_digest send examples/daily-digest.md --values examples/values.json --rules examples/rules.json --send-cmd ./examples/send-stdout.sh
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck examples/*.sh
